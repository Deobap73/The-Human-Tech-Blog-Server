# .github/workflows/deploy.yml
name: Deploy Server to Railway

on:
  push:
    branches: [main]

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build server
        working-directory: The-Human-Tech-Blog-Server
        run: |
          npm ci
          npm run build

      - name: Setup Railway CLI
        uses: railwayapp/railway-action/setup-railway-cli@v1
        with:
          apiKey: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy to Railway
        working-directory: The-Human-Tech-Blog-Server
        run: railway up --detach --service server
